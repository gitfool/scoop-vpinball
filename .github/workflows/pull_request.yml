name: pull-request
on:
  pull_request:
    types: [ opened ]

permissions:
  contents: read
  pull-requests: write

jobs:
  handler:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@main

      - name: Run handler
        uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
